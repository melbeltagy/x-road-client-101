[versions]
spring-boot = "4.0.6"
# Override Spring Boot 4.0.6's bundled Tomcat (11.0.21) to patch CVE-2026-43515,
# CVE-2026-43512, CVE-2026-41293, CVE-2026-42498, CVE-2026-43513, CVE-2026-41284,
# CVE-2026-43514. Drop this entry once Spring Boot's BOM ships a patched Tomcat.
tomcat = "11.0.22"
jacoco = "0.8.14"
checkstyle = "13.5.0"
mapstruct = "1.6.3"
archunit = "1.4.2"
bouncycastle = "1.84"
node-gradle = "7.1.0"
spotbugs = "6.5.5"
owasp-dependencycheck = "12.2.2"
cyclonedx-bom = "3.2.4"

[libraries]
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot-test-autoconfigure = { module = "org.springframework.boot:spring-boot-test-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

lombok = { module = "org.projectlombok:lombok" }

commons-lang3 = { module = "org.apache.commons:commons-lang3" }

bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

archunit-junit5-api = { module = "com.tngtech.archunit:archunit-junit5-api", version.ref = "archunit" }
archunit-junit5-engine = { module = "com.tngtech.archunit:archunit-junit5-engine", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-bom" }
