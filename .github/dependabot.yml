version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["*junit*", "*mockito*", "*archunit*"]
    open-pull-requests-limit: 5

  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/src/main/webapp"
    schedule:
      interval: "weekly"
    groups:
      vue:
        patterns: ["vue*", "@vue*"]
      vuetify:
        patterns: ["vuetify*"]
      testing:
        patterns: ["vitest*", "@vitest*"]
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
        ci:
          patterns: ["*"]
    open-pull-requests-limit: 3
