version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      spring-patch:
        patterns:
          - "org.springframework*"
        update-types:
          - "patch"
      backend-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/src/main/webapp"
    schedule:
      interval: "weekly"
    groups:
      javascript-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 3
