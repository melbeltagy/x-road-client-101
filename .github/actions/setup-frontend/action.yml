name: 'Setup Frontend'
description: 'Set up pnpm 11 + Node 24 and install webapp dependencies'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: 'src/main/webapp/pnpm-lock.yaml'
    - name: Install dependencies
      run: pnpm install
      working-directory: src/main/webapp
      shell: bash
