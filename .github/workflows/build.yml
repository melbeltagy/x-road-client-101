name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  pnpm_config_minimumReleaseAge: 0

on:
  workflow_dispatch:
  push:
    branches: ['*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: ['*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test -x webapp -x webapp_test -x pnpmInstall

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: src/main/webapp/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: src/main/webapp
      - name: Run tests
        run: pnpm test:run
        working-directory: src/main/webapp

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew assemble
      - uses: actions/upload-artifact@v5
        with:
          name: jar
          path: build/libs/*.jar
          retention-days: 7

  docker:
    name: Docker
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
