name: Build

on:
  workflow_dispatch:
  push:
    branches: ['*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: ['*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test -x webapp -x pnpmInstall

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: src/main/webapp/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: src/main/webapp
      - name: Run tests
        run: pnpm test:run
        working-directory: src/main/webapp

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew assemble
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          retention-days: 7
