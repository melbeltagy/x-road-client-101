name: Security Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit-backend:
    name: OWASP Dependency-Check (Backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: Cache OWASP NVD database
        uses: actions/cache@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}
      - name: Run OWASP dependency check
        env:
          # NVD throttles unauthenticated requests (HTTP 429). Request a key at
          # https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret
          # named NVD_API_KEY. Without it the scan still runs but takes much longer.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Continue past the gradle-level fail-on-CVSS so we still upload SARIF + HTML for triage.
        # The dedicated check step below re-fails the job after artifacts are published.
        run: ./gradlew dependencyCheckAnalyze || echo "DEPCHECK_FAILED=1" >> "$GITHUB_ENV"
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: owasp-dependency-check
      - name: Upload dependency-check report
        if: always() && hashFiles('build/reports/dependency-check-report.*') != ''
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          retention-days: 30
      - name: Fail job if CVEs above threshold were found
        if: env.DEPCHECK_FAILED == '1'
        run: |
          echo "OWASP dependency-check failed (CVSS >= 7 finding or analyzer error). See uploaded report."
          exit 1

  audit-frontend:
    name: pnpm audit (Frontend)
    # Mirrors the BE weekly cadence so FE CVEs published between PRs get caught here too.
    # Per-PR audit still runs in build.yml; this is the belt-and-suspenders layer.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
        working-directory: src/main/webapp
