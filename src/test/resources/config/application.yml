# ===================================================================
# Spring Boot configuration for unit/integration tests.
# ===================================================================

spring:
  application:
    name: xRoadExampleRestapiClient
  jackson:
    serialization:
      write-durations-as-timestamps: false
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    user:
      name: test
      password: test
      roles:
        - USER
  task:
    execution:
      thread-name-prefix: x-road-example-restapi-client-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: x-road-example-restapi-client-scheduling-
      pool:
        size: 20

server:
  port: 10344
  address: localhost

# ===================================================================
# Application specific properties
# ===================================================================

app:
  clientApp:
    name: 'xRoadExampleRestapiClientApp'
  logging:
    use-json-format: false

management:
  health:
    mail:
      enabled: false
