/**
 * Node.js and pnpm configuration for Vue frontend builds.
 */

plugins {
    id "com.github.node-gradle.node"
}

node {
    nodeProjectDir = file("${project.projectDir}/src/main/webapp")
    version = "24.16.0"  // LTS version
    pnpmVersion = "11.2.2"
    download = true
}

task webapp_test(type: NpxTask) {
    workingDir = file("${project.projectDir}/src/main/webapp")
    inputs.property('appVersion', project.version)
    inputs.files("src/main/webapp/package.json", "src/main/webapp/pnpm-lock.yaml", "src/main/webapp/tsconfig.json", "src/main/webapp/vitest.config.ts")
        .withPropertyName('vue-config')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir("src/main/webapp/src/")
        .withPropertyName("vue-source")
        .withPathSensitivity(PathSensitivity.RELATIVE)

    outputs.dir("build/test-results/vitest/")
        .withPropertyName("vitest-result-dir")

    dependsOn compileTestJava
    command = "pnpm"
    args = ["test", "--run"]
}

test.dependsOn webapp_test
